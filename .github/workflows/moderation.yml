# Modération automatique du TOP PROUTS : toutes les 10 minutes, le robot écoute les prouts en attente
# (scripts/moderate.mjs), publie les prouts, refuse les voix évidentes, laisse les cas douteux à Noa.
# Le jeton admin est le secret PROUTBOX_ADMIN_TOKEN du dépôt (jamais dans le code ni dans les journaux).
name: Modération des prouts
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moderation
  cancel-in-progress: false
jobs:
  ecouter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/moderate.mjs
            www/index.html
            www/supabase-config.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Écouter la file
        env:
          PROUTBOX_ADMIN_TOKEN: ${{ secrets.PROUTBOX_ADMIN_TOKEN }}
        run: node scripts/moderate.mjs
